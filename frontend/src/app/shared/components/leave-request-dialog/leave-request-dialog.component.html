<div class="leave-dialog">
  <h2 mat-dialog-title>
    <mat-icon>event_available</mat-icon>
    <span>Request Leave</span>
  </h2>

  <mat-dialog-content>
    <form [formGroup]="form">
      <!-- Leave Type Cards -->
      <div class="leave-types">
        @for (type of leaveTypes; track type.value) {
          <button type="button" 
                  class="leave-type-card"
                  [class.selected]="form.get('type')?.value === type.value"
                  (click)="selectLeaveType(type.value)">
            <mat-icon [style.color]="type.color">{{ type.icon }}</mat-icon>
            <span class="type-label">{{ type.label }}</span>
          </button>
        }
      </div>

      <!-- Date Range -->
      <div class="date-range">
        <mat-form-field appearance="outline" class="date-field">
          <mat-label>From</mat-label>
          <input matInput [matDatepicker]="startPicker" formControlName="startDate" [min]="minDate">
          <mat-datepicker-toggle matIconSuffix [for]="startPicker"></mat-datepicker-toggle>
          <mat-datepicker #startPicker></mat-datepicker>
        </mat-form-field>

        <mat-icon class="arrow-icon">arrow_forward</mat-icon>

        <mat-form-field appearance="outline" class="date-field">
          <mat-label>To</mat-label>
          <input matInput [matDatepicker]="endPicker" formControlName="endDate" [min]="form.get('startDate')?.value || minDate">
          <mat-datepicker-toggle matIconSuffix [for]="endPicker"></mat-datepicker-toggle>
          <mat-datepicker #endPicker></mat-datepicker>
        </mat-form-field>
      </div>

      <!-- Days Summary -->
      @if (calculatedDays > 0) {
        <div class="days-summary">
          <mat-icon>event</mat-icon>
          <span class="days-count">{{ calculatedDays }}</span>
          <span class="days-label">{{ calculatedDays === 1 ? 'day' : 'days' }}</span>
        </div>
      }

      <!-- Reason -->
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Reason</mat-label>
        <textarea matInput 
                  formControlName="reason" 
                  rows="3"
                  maxlength="200"
                  placeholder="Brief reason for your leave"
                  required></textarea>
        <mat-hint align="end">{{ form.get('reason')?.value?.length || 0 }}/200</mat-hint>
        <mat-error *ngIf="form.get('reason')?.hasError('required')">Reason is required</mat-error>
      </mat-form-field>
    </form>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button mat-button type="button" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
    <button mat-flat-button color="primary" (click)="onSubmit()" [disabled]="!form.valid || calculatedDays === 0 || isSubmitting">
      @if (isSubmitting) {
        <mat-spinner diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
        Submitting...
      } @else {
        Submit Request
      }
    </button>
  </mat-dialog-actions>
</div>
