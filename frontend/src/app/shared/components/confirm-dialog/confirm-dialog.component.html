<div class="confirm-dialog" [attr.data-theme]="data.type">
  <div class="dialog-header">
    <mat-icon [ngClass]="'icon-' + data.type">
      @switch (data.type) {
        @case ('success') { check_circle }
        @case ('warning') { warning }
        @case ('error') { error }
        @default { info }
      }
    </mat-icon>
    <h2 class="dialog-title">{{ data.title }}</h2>
  </div>
  
  <div class="dialog-content">
    <p>{{ data.message }}</p>
  </div>
  
  <div class="dialog-actions">
    <button mat-button (click)="onCancel()" class="cancel-button">
      {{ data.cancelText }}
    </button>
    <button mat-raised-button (click)="onConfirm()" [color]="data.type === 'error' ? 'warn' : 'primary'">
      {{ data.confirmText }}
    </button>
  </div>
</div>
